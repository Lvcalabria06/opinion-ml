# =====================================================================
# Baseline do modelo (CC3) — seções 4.4 e 4.5
# ---------------------------------------------------------------------
# Treina no split "treino", escolhe algoritmo, limiar e decide se supera a regra no
# "validacao"; o "teste" só é relatado (nada é escolhido com ele). Padronização só no treino (pipeline sklearn).
# =====================================================================

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db   # banco do MLflow junto dos artefatos, em mlruns/
  experimento: opinion-cc3-lastfm
  modelo_registrado: opinion-baseline-cc3-lastfm
  alias: champion

# Público avaliado e métrica de escolha.
#   publico: todos          -> experimento Last.fm: o recorte "desconhecidos" não existe; todos os
#                              encontros são avaliados e PR-AUC geral é a métrica.
#   publico: desconhecidos  -> linha principal (Amazon): avalia só encontros com algum_segue == 0 e a
#                              métrica pr_auc vira automaticamente pr_auc_desconhecidos (decisão D-006).
# Para restaurar a linha principal basta trocar `publico` para "desconhecidos" (a métrica é derivada
# do público em treinar.chave_metrica); restaure também os nomes MLflow sem o sufixo -lastfm
# (mlflow.* e comparacao.*) para não misturar as linhas. Sempre reportamos também a prevalência e a regra simples.
metrica: pr_auc
publico: todos

candidatos:
  regressao_logistica:
    tipo: logreg
    grade:
      C: [0.1, 1.0, 10.0]
      class_weight: [null, balanced]
  arvore_decisao:
    tipo: arvore
    grade:
      max_depth: [4, 6, 8]
      min_samples_leaf: [20, 50]

# Limiar de decisão: maximiza F-beta no público avaliado (ver `publico`) da validação. beta = 0,5 pesa a
# precisão o dobro do recall (um sinal errado cansa o usuário). A regra simples recebe o
# mesmo tratamento: o limiar do compat_score também é escolhido na validação.
limiar:
  beta: 0.5

# =====================================================================
# CC4 — comparação de 3+ modelos (python -m opinion.modelo.comparar)
# ---------------------------------------------------------------------
# Mesmo protocolo do CC3: treino 1–8, escolha da configuração e do limiar de
# cada família na validação, teste medido uma vez por família só para relatar.
# Grades pequenas e fixas de propósito: otimização de hiperparâmetros é o CC5
# (Optuna) e validação cruzada/estabilidade é o CC6.
# =====================================================================
comparacao:
  experimento: opinion-cc4-lastfm
  modelo_registrado: opinion-cc4-lastfm
  alias: melhor
  referencia: regressao_logistica           # o baseline do CC3, contra quem as diferenças são medidas
  bootstrap: {n: 1000, semente: 0}          # intervalo de confiança das diferenças no teste
  importancia: {repeticoes: 5, semente: 0}  # importância por permutação, na validação
  modelos:
    regressao_logistica:
      tipo: logreg
      grade:
        C: [0.1, 1.0, 10.0]
        class_weight: [null, balanced]
    arvore_decisao:
      tipo: arvore
      grade:
        max_depth: [4, 6, 8]
        min_samples_leaf: [20, 50]
    random_forest:
      tipo: random_forest
      grade:
        n_estimators: [300]
        max_depth: [8, 12]
        min_samples_leaf: [20, 50]
    gradient_boosting:
      tipo: hist_gb
      grade:
        learning_rate: [0.05, 0.1]
        max_leaf_nodes: [15, 31]
        min_samples_leaf: [50]

# =====================================================================
# CC5 — otimização de hiperparâmetros com Optuna (python -m opinion.modelo.otimizar)
# ---------------------------------------------------------------------
# Busca bayesiana (TPE) por família, sempre no treino com objetivo medido na validação
# (a métrica de `metrica`/`publico`). O melhor de cada família é reajustado e o teste é
# medido uma única vez, só para relatar. O vencedor também sai da validação.
# `regulariza: menor|maior` diz em que direção o parâmetro regulariza mais (modelo mais simples):
# usado só para interpretar um melhor ponto na borda do espaço.
# Tipos de espaço: float_log, int, int_log (min/max inclusivos) e categorico (valores).
# =====================================================================
otimizacao:
  experimento: opinion-cc5-lastfm
  modelo_registrado: opinion-cc5-lastfm
  alias: melhor
  semente: 42
  familias:
    regressao_logistica:
      tipo: logreg
      tentativas: 50
      espaco:
        C: {tipo: float_log, min: 0.00001, max: 100, regulariza: menor}
        class_weight: {tipo: categorico, valores: [null, balanced]}
    random_forest:
      tipo: random_forest
      tentativas: 30
      espaco:
        n_estimators: {tipo: int, min: 100, max: 400}
        max_depth: {tipo: int, min: 2, max: 24, regulariza: menor}
        min_samples_leaf: {tipo: int_log, min: 5, max: 200, regulariza: maior}
        max_features: {tipo: categorico, valores: [sqrt, log2, 0.5]}
        class_weight: {tipo: categorico, valores: [null, balanced, balanced_subsample]}

# =====================================================================
# CC6 — validação cruzada, estabilidade e curvas (python -m opinion.modelo.validar)
# ---------------------------------------------------------------------
# StratifiedGroupKFold: estratificada pelo rótulo `conectou` (positivos raros) e agrupada por `par_id`
# (os encontros de um mesmo par nunca ficam em dois folds). Usa só treino + validação; o teste fica fora.
# Os hiperparâmetros das duas famílias vêm de data/processed/otimizacao.json (CC5). A regra simples
# (compat_score) entra como referência, sem ajuste. As curvas usam `sementes_curvas` (menos que `sementes`
# para limitar o tempo): fração do treino de cada fold (por par) e um hiperparâmetro de complexidade.
# =====================================================================
validacao_cruzada:
  experimento: opinion-cc6-lastfm
  k: 5
  sementes: [0, 1, 2]
  sementes_curvas: [0]
  fracoes_aprendizado: [0.1, 0.25, 0.5, 0.75, 1.0]
  complexidade:
    regressao_logistica: {parametro: C, valores: [0.00002, 0.0001, 0.001, 0.01, 0.1, 1, 10, 100]}
    random_forest: {parametro: max_depth, valores: [2, 3, 4, 8, 12, 16, 24]}
