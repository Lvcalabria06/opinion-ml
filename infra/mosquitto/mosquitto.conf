# Mosquitto — ambiente de desenvolvimento do OpiniOn
# Acesso anônimo liberado só para desenvolvimento/apresentação.
# Em produção: allow_anonymous false + password_file + TLS (porta 8883).

listener 1883
allow_anonymous true

# A ingestão usa sessão persistente (QoS 1). Fila maior por assinante para não
# descartar mensagens se a ingestão ficar um pouco atrás do replay.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
